function historico(){
    historicoId.innerHTML=''
    let id = sessionStorage.ID_USUARIO
    fetch(`/dashboard/pegarHistorico/${id}`, {
    method: "GET",   
})
      .then(res => {
        res.json().then(json => {
            json.forEach(element => {
                historicoId.innerHTML+=`<div class="historico-pequeno">
                                <img src="../assets/imgs/character-icons/${element.fk_personagem}.png" alt="">
                                <span class="dadosHistorico">
                                    <p>Nome: ${nomes[element.fk_personagem-1]}</p>
                                    <p>Data: ${element.data_registro.split('T')[0]} </p>
                                </span>
                                <p class="trocar" onclick="alterarPersonagem(${element.fk_personagem})">Alterar para esse</p>
                            </div>  
                            `
            });
        })
      })
      .catch(err => {
        console.log(err);
      })
}
    
function alterarPersonagem(indice){
fetch("/questionario/dashboardTrocar", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      indice: indice,
      id_usuario : sessionStorage.ID_USUARIO
    })
    })
      
  sessionStorage.FK_PERSONAGEM = indice; 

    adicionarHistorico(indice)
   
              setTimeout(() => {
            window.location.reload();
          }, "500");
}


function iconeDoUsuario() {
    let indice = sessionStorage.FK_PERSONAGEM
            
    if (indice>0 && indice<21){
        nome_personagem.innerHTML = 'Personagem atual: '+nomes[indice - 1]
        
        iconePersonagem.src = '../assets/imgs/character-icons/' + indice + '.png'
    }else {
        nome_personagem.innerHTML='Faça o questionário!'
    }
    

}

let dadosGlobais = [[],[]]
let myChart

function obterDadosGrafico(){
    
    fetch(`/dashboard/graficosBarra`, {cache: 'no-store'}).then(function (response) {
        if (response.ok) {
            response.json().then(function (resposta) {
                console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);
                
                
                let total = 0
                
                for(let i = 0; i<resposta.length; i++){
                    total+= resposta[i].contador
                }
                total_quiz.innerHTML=total
                
                for(let i = 0; i<resposta.length; i++){
                        if(resposta[i].contador>0){
                            dadosGlobais[0].push(resposta[i])
                        } 
                        if(resposta[i].curtidas>0){
                            dadosGlobais[1].push(resposta[i])
                        }
                    }

                    console.log(dadosGlobais)
                    graficoPizza()
                    graficoBarra()
                    kpiCalculo()
                    // plotarGraficoBarra(resposta);
                });
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
            }
        })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
            });
}


function kpiCalculo(){
    let indice = sessionStorage.FK_PERSONAGEM
    let nomePersonagemFuncao= nomes[indice - 1]
    nomePersonagemConta.innerHTML = nomePersonagemFuncao
    nomePersonagemConta2.innerHTML = nomePersonagemFuncao
    
    let contadorTotal = 0
    let curtidasTotal = 0
    let contadorPersonagem = 0
    let curtidasPersonagem = 0

for(let i = 0; i<dadosGlobais[0].length; i++){
    contadorTotal+= dadosGlobais[0][i].contador
}
for(let i = 0; i<dadosGlobais[1].length; i++){
    curtidasTotal+= dadosGlobais[1][i].curtidas
}
for(let i = 0; i<dadosGlobais[0].length; i++){
    if(dadosGlobais[0][i].nome==nomePersonagemFuncao){
        contadorPersonagem= dadosGlobais[0][i].contador
    }
}
for(let i = 0; i<dadosGlobais[1].length; i++){
    if(dadosGlobais[1][i].nome==nomePersonagemFuncao){
        curtidasPersonagem= dadosGlobais[1][i].curtidas
    }
}

resultadoTotalCurtidas.innerHTML = curtidasTotal
resultadoTotalVotos.innerHTML = contadorTotal


let divisaoCurtidas = (100*curtidasPersonagem)/curtidasTotal
let divisaoContador = (100*contadorPersonagem)/contadorTotal

resultadoEspecificoCurtidas.innerHTML = `Curtidas: ${curtidasPersonagem}
<br>
    ${divisaoCurtidas.toFixed(2)}% do total`
resultadoEspecificoVotos.innerHTML=`Votos: ${contadorPersonagem}
<br>
    ${divisaoContador.toFixed(2)}% do total`

}

function atualizarDados(){
    let dadosBarra = []


        if(selectGraficoBarra.value == 'curtidas'){
        for(let i = 0; i<dadosGlobais[1].length; i++){
            if(dadosGlobais[1][i].curtidas>0){
                dadosBarra.push(dadosGlobais[1][i])
            } else {
                continue
            }
        }
                if(selectOrdemBarra.value == 'DESC'){   
            for(let i = 0; i<dadosBarra.length; i++){
                for(let j = 0; j<dadosBarra.length-1; j++){
                    // console.log(dadosBarra[i])
                    if(dadosBarra[j].curtidas < dadosBarra[j+1].curtidas){
                        let temp = dadosBarra [j]
                        dadosBarra[j]=dadosBarra[j+1]
                        dadosBarra[j+1]=temp
                    }
                }
            }
        } 
        if(selectOrdemBarra.value == 'ASC'){
            for(let i = 0; i<dadosBarra.length; i++){
                for(let j = 0; j<dadosBarra.length-1; j++){
                    // console.log(dadosBarra[i])
                    if(dadosBarra[j].curtidas > dadosBarra[j+1].curtidas){
                        let temp = dadosBarra [j]
                        dadosBarra[j]=dadosBarra[j+1]
                        dadosBarra[j+1]=temp
                    }
                }
            }
        }
        
    }
    if(selectGraficoBarra.value == 'contador'){
        for(let i = 0; i<dadosGlobais[0].length; i++){
            if(dadosGlobais[0][i].contador>0){
                dadosBarra.push(dadosGlobais[0][i])
            } else {
                continue
            }
        }
                if(selectOrdemBarra.value == 'DESC'){   
            for(let i = 0; i<dadosBarra.length; i++){
                for(let j = 0; j<dadosBarra.length-1; j++){
                    // console.log(dadosBarra[i])
                    if(dadosBarra[j].contador < dadosBarra[j+1].contador){
                        let temp = dadosBarra [j]
                        dadosBarra[j]=dadosBarra[j+1]
                        dadosBarra[j+1]=temp
                    }
                }
            }
        } 
        if(selectOrdemBarra.value == 'ASC'){
            for(let i = 0; i<dadosBarra.length; i++){
                for(let j = 0; j<dadosBarra.length-1; j++){
                    // console.log(dadosBarra[i])
                    if(dadosBarra[j].contador > dadosBarra[j+1].contador){
                        let temp = dadosBarra [j]
                        dadosBarra[j]=dadosBarra[j+1]
                        dadosBarra[j+1]=temp
                    }
                }
            }
        }
    }

    return dadosBarra
}
